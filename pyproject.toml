[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-trading-tools"
version = "0.1.0"
description = "Safety-gated Robinhood trading tool definitions and service layer."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.21", "mypy==1.19.1", "coverage==7.10.7", "pip-audit==2.9.0", "pandas==3.1.0", "yfinance==1.7.0"]

[project.scripts]
cio = "robinhood_tools.cli:main"

[tool.setuptools]
packages = ["robinhood_tools"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "robinhood_tools.*",
    "robinhood_tools.event_protection",
    "robinhood_tools.fill_reconciler",
    "robinhood_tools.market_prices",
    "robinhood_tools.option_entry_risk",
    "robinhood_tools.options_gate",
    "robinhood_tools.profit_taking",
    "robinhood_tools.realtime_stream",
    "robinhood_tools.trade_state",
]
ignore_errors = true

[tool.coverage.run]
source = ["robinhood_tools"]

[tool.coverage.report]
fail_under = 75
omit = [
    "robinhood_tools/confidence.py",
    "robinhood_tools/realtime_stream.py",
    "robinhood_tools/regime_detector.py",
]
