<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f19">
<title>Trading — how the desk is doing</title>
<link rel="stylesheet" href="/office.css">
<style>
  body { margin: 0; background: #080f19; color: #dce6f5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header.top { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid #1b2a3f; }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }
  header.top a { color: #7fa8d8; text-decoration: none; font-size: 13px; }
  header.top a:hover { text-decoration: underline; }
  header.top .spacer { flex: 1; }
  header.top .clock { font-size: 13px; color: #8fa8c8; }
  .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; padding: 18px 22px; max-width: 1280px; }
  .card { background: #0d1626; border: 1px solid #1b2a3f; border-radius: 10px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #7fa8d8; }
  .big { font-size: 26px; margin: 2px 0; }
  .pos { color: #4fd08a; } .neg { color: #ff7a7a; } .dim { color: #8fa8c8; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: #7fa8d8; font-weight: 500; padding: 4px 6px; border-bottom: 1px solid #1b2a3f; }
  td { padding: 4px 6px; border-bottom: 1px solid #14202f; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 11px; border: 1px solid #2a4a66; }
  .tag.ok { color: #4fd08a; border-color: #2b5f43; }
  .tag.block { color: #ffce6a; border-color: #6a5626; }
  .tag.err { color: #ff7a7a; border-color: #6a2b2b; }
  .reason { color: #9db4cc; font-size: 11.5px; max-width: 340px; }
  .pace { font-size: 12px; color: #ffce6a; }
  .err { color: #ff7a7a; font-size: 13px; }
  footer { padding: 10px 22px; color: #5f7fa0; font-size: 11.5px; }
</style>
</head>
<body>
<header class="top">
  <h1>TRADING DESK — HOW IT'S GOING</h1>
  <a href="/pipeline">pipeline diagram</a>
  <a href="/">← office</a>
  <div class="spacer"></div>
  <div class="clock" id="clock">–</div>
</header>
<div class="wrap">
  <section class="card">
    <h2>Weekly objective</h2>
    <div class="big" id="obj-big">–</div>
    <div class="pace" id="obj-pace"></div>
    <div class="dim" id="obj-sub" style="font-size:12px;margin-top:6px"></div>
  </section>
  <section class="card">
    <h2>Positions</h2>
    <div id="positions"></div>
  </section>
  <section class="card">
    <h2>Today's decisions</h2>
    <div id="today"></div>
  </section>
  <section class="card">
    <h2>Scorecard (paper track record)</h2>
    <div id="scorecard"></div>
  </section>
  <section class="card" style="grid-column: 1 / -1">
    <h2>Recent decisions &amp; blocks (shadow log)</h2>
    <div id="shadows"></div>
  </section>
</div>
<footer>Paper trading only — research software, not financial advice. Read-only; auto-refreshes every 30s.</footer>
<script>
const fmt$ = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, {maximumFractionDigits: 0});
const pct = (n) => (n >= 0 ? "+" : "") + n + "%";
const sign = (n) => (n >= 0 ? "pos" : "neg");

async function refresh() {
  let d;
  try {
    const r = await fetch("/api/trading", {cache: "no-store"});
    d = await r.json();
  } catch (e) {
    document.getElementById("obj-big").innerHTML = "<span class='err'>site unreachable</span>";
    return;
  }
  document.getElementById("clock").textContent = d.generated_at || "";
  const o = d.objective || {};
  if (o.cadence === "weekly") {
    const pnl = o.week_pnl_usd ?? 0;
    document.getElementById("obj-big").innerHTML =
      `<span class="${sign(pnl)}">${fmt$(pnl)}</span> <span class="dim" style="font-size:15px">of $10,000 this week (${pct(o.week_pct ?? 0)})</span>`;
    document.getElementById("obj-pace").textContent =
      o.sessions_left ? `${o.sessions_left} session(s) left -> ${fmt$((10000 - pnl) / o.sessions_left)}/session pace` : "";
    document.getElementById("obj-sub").textContent =
      `equity ${fmt$(o.equity ?? 0)} | all-time ${fmt$(o.all_time_pnl_usd ?? 0)}`;
  } else if (o.equity) {
    document.getElementById("obj-big").textContent = `equity ${fmt$(o.equity)}`;
  }

  const pos = document.getElementById("positions");
  if (!d.positions || !d.positions.length) pos.innerHTML = "<div class='dim'>flat — no open positions</div>";
  else pos.innerHTML = "<table><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Now</th><th>P/L</th></tr>" +
    d.positions.map(p => `<tr><td>${p.symbol}</td><td>${p.qty}</td><td>${p.avg_entry_price}</td>` +
      `<td>${p.current_price}</td><td class="${sign(parseFloat(p.unrealized_pl))}">` +
      `${fmt$(parseFloat(p.unrealized_pl))} (${(parseFloat(p.unrealized_plpc) * 100).toFixed(1)}%)</td></tr>`).join("") + "</table>";

  const t = document.getElementById("today");
  if (!d.today || !d.today.length) t.innerHTML = "<div class='dim'>no decisions recorded today</div>";
  else t.innerHTML = "<table><tr><th>Ticker</th><th>Decision</th><th>Outcome</th></tr>" +
    d.today.map(r => {
      const placed = String(r.action || "").endsWith("_placed");
      const cls = placed ? "ok" : (String(r.action) === "error" || String(r.reason || "").startsWith("error") ? "err" : "block");
      return `<tr><td>${r.ticker}</td><td>${r.decision || "-"}</td>` +
        `<td><span class="tag ${cls}">${r.action}</span><div class="reason">${(r.reason || "").slice(0, 90)}</div></td></tr>`;
    }).join("") + "</table>" +
    (d.option_entries && d.option_entries.length
      ? `<div style="margin-top:8px;font-size:12px">options entries: <b>${d.option_entries.join(" · ")}</b></div>` : "");

  const s = d.scorecard || {};
  document.getElementById("scorecard").innerHTML =
    `<div class="big">${s.graded ?? 0}</div><div class="dim">graded decisions</div>` +
    `<div style="margin-top:8px;font-size:13px">thesis right <b class="pos">${s.thesis_right ?? 0}</b> · ` +
    `wrong <b class="neg">${s.thesis_wrong ?? 0}</b> · avg excess vs S&P <b>${s.avg_excess_pct ?? "–"}%</b></div>` +
    `<div class="dim" style="font-size:12px;margin-top:4px">shadow rows recorded: ${s.shadow_rows ?? 0}</div>`;

  const sh = document.getElementById("shadows");
  if (!d.recent_shadows || !d.recent_shadows.length) sh.innerHTML = "<div class='dim'>nothing recorded yet</div>";
  else sh.innerHTML = "<table><tr><th>Date</th><th>Symbol</th><th>Action</th><th>Regime</th><th>Decision</th><th>Reason</th></tr>" +
    d.recent_shadows.map(r => `<tr><td>${r.date}</td><td>${r.symbol}</td>` +
      `<td>${r.action}</td><td>${r.regime}</td><td>${r.decision || "-"}</td>` +
      `<td class="reason">${r.reason}</td></tr>`).join("") + "</table>";
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
