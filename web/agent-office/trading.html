<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050a12">
<title>Trading Desk — Live</title>
<link rel="stylesheet" href="/office.css">
<style>
  :root {
    --bg: #050a12;
    --bg-card: #0b1220;
    --bg-card-hover: #121c31;
    --border: #1f2a44;
    --border-focus: #3b82f6;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --green: #22c55e;
    --green-dark: #15803d;
    --red: #ef4444;
    --red-dark: #b91c1c;
    --amber: #f59e0b;
    --purple: #a855f7;
    --font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { font-size: 13px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* Hide scrollbar for cleaner look */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0b1220; }
  ::-webkit-scrollbar-thumb { background: #1e2a44; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center; gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    backdrop-filter: blur(8px);
  }
  header.top h1 {
    font-size: 14px; margin: 0; letter-spacing: .06em; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  header.top h1 .live-dot {
    width: 8px; height: 8px; background: var(--green);
    border-radius: 50%; box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  header.top a {
    color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600;
  }
  header.top a:hover { color: var(--accent-hover); text-decoration: underline; }
  header.top .spacer { flex: 1; }
  header.top .clock {
    font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums;
    font-family: ui-monospace;
  }
  header.top .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-family: ui-monospace;
  }
  header.top .status .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 6px var(--green);
  }

  .wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    padding: 16px 24px 32px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ============ Cards ============ */
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover { border-color: var(--border-focus); transform: translateY(-2px); }
  .card h2 {
    margin: 0 0 14px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card h2 .refresh {
    font-size: 10px; font-weight: 400; color: var(--text-muted);
    opacity: 0.6;
  }

  /* Big number cards */
  .big-card {
    display: flex; flex-direction: column;
  }
  .big {
    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
    margin: 2px 0 2px;
  }
  .big .unit {
    font-size: 14px; font-weight: 500; color: var(--text-muted); margin-left: 4px;
  }
  .sub {
    font-size: 12px; color: var(--text-muted); margin: 4px 0 0;
  }
  .sub small { font-size: 11px; color: var(--text-muted); }

  /* Stat row */
  .stat-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-top: 12px;
  }
  .stat-item {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .stat-item .label {
    font-size: 11px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 3px;
  }
  .stat-item .value {
    font-size: 15px; font-weight: 700; font-family: ui-monospace;
  }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left; color: var(--text-muted); font-weight: 600;
    padding: 6px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  td {
    padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.03); }

  /* Tags */
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  }
  .tag.ok { color: var(--green); border: 1px solid rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }
  .tag.block { color: var(--amber); border: 1px solid rgba(245,158,11,0.3); background: rgba(245,158,11,0.08); }
  .tag.err { color: var(--red); border: 1px solid rgba(239,68,68,0.3); background: rgba(239,68,68,0.08); }
  .tag.long { color: var(--green); border: 1px solid var(--green); background: rgba(74,222,128,0.1); }
  .tag.short { color: var(--red); border: 1px solid var(--red); background: rgba(239,68,68,0.1); }

  .reason {
    color: var(--text-muted); font-size: 10.5px; max-width: 240px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Empty states */
  .empty {
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; color: var(--text-muted);
  }
  .empty .icon {
    font-size: 32px; margin-bottom: 8px; opacity: 0.5;
  }

  /* Banner alerts */
  .alert-banner {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
    font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  .alert-banner.warn {
    background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25);
    color: var(--amber);
  }
  .alert-banner.err {
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25);
    color: var(--red);
  }

  /* Refresh badge */
  .refresh-badge {
    font-size: 10px; color: var(--text-muted); font-family: ui-monospace;
    margin-left: 8px; opacity: 0.6;
  }

  footer {
    padding: 12px 24px; color: var(--muted); font-size: 11px;
    border-top: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center;
  }
</style>
</head>
<body>
<header class="top">
  <h1>
    <span class="live-dot"></span>
    TRADING DESK — LIVE
  </h1>
  <a href="/pipeline">pipeline</a>
  <a href="/">office</a>
  <div class="spacer"></div>
  <div class="status">
    <div class="dot"></div>
    <span>LIVE</span>
  </div>
  <div class="clock" id="clock">–</div>
</header>

<div class="wrap">
  <!-- Weekly Objective -->
  <section class="card big-card">
    <h2>Weekly Objective<span class="refresh-badge" id="obj-refresh">—</span></h2>
    <div class="big" id="obj-big">–</div>
    <div class="pace" id="obj-pace"></div>
    <div class="dim" id="obj-sub" style="font-size:12px;margin-top:6px"></div>
    <div id="obj-today" style="font-size:13px;margin-top:6px"></div>
  </section>

  <!-- Positions by Direction -->
  <section class="card">
    <h2>Positions<span class="refresh-badge" id="pos-refresh">—</span></h2>
    <div id="positions-dir"></div>
    <div id="positions"></div>
  </section>

  <!-- Scorecard -->
  <section class="card">
    <h2>Scorecard<span class="refresh-badge" id="score-refresh">—</span></h2>
    <div id="scorecard"></div>
  </section>

  <!-- Today's Decisions -->
  <section class="card">
    <h2>Today's Decisions<span class="refresh-badge" id="dec-refresh">—</span></h2>
    <div id="today"></div>
  </section>

  <!-- Strategy Performance -->
  <section class="card" style="grid-column: 1 / -1;">
    <h2>Strategy Performance<span class="refresh-badge" id="strat-refresh">—</span></h2>
    <div id="strategy-perf"></div>
  </section>

  <!-- Shadow Log -->
  <section class="card" style="grid-column: 1 / -1;">
    <h2>Recent Decisions &amp; Blocks<span class="refresh-badge" id="shadow-refresh">—</span></h2>
    <div id="shadows"></div>
  </section>
</div>

<footer>
  <div>Paper trading only — research software, not financial advice.</div>
  <div>Auto-refreshes every 30s &nbsp;|&nbsp; Last updated: <span id="last-updated">–</span></div>
</footer>

<script>
const fmt$ = (n) => {
  const abs = Math.abs(n);
  return (n < 0 ? "-$" : "$") + abs.toLocaleString(undefined, {maximumFractionDigits: 0});
};
const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
const sign = (n) => (n >= 0 ? "pos" : "neg");
const fmtNum = (n) => n.toLocaleString(undefined, {maximumFractionDigits: 2});

let lastData = null;

async function refresh() {
  let d;
  try {
    const r = await fetch("/api/trading", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (e) {
    document.getElementById("alert-banner").innerHTML =
      '<div class="alert-banner err">⚠ Site unreachable — ' +
      (e.message || e) + '</div>';
    document.getElementById("alert-banner").style.display = "flex";
    return;
  }
  document.getElementById("alert-banner").style.display = "none";
  document.getElementById("clock").textContent = d.generated_at || "";
  document.getElementById("last-updated").textContent =
    "Last updated: " + (d.generated_at || "–");

  const now = new Date();
  document.querySelectorAll("[id$='-refresh']").forEach(el => {
    el.textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  });

  renderObjective(d.objective || {});
  renderPositions(d.positions || [], d.positions_by_direction || {});
  renderScorecard(d.scorecard || {});
  renderDecisions(d.today || [], d.option_entries || []);
  renderStrategyPerf(d.scorecard || {});
  renderShadows(d.recent_shadows || []);

  lastData = d;
}

function renderObjective(o) {
  const pnl = o.week_pnl_usd ?? 0;
  const big = document.getElementById("obj-big");
  big.innerHTML = `<span class="${sign(pnl)}">${fmt$(pnl)}</span>`;
  big.innerHTML += ` <span class="dim" style="font-size:15px">of $10,000 this week (${pct(o.week_pct ?? 0)})</span>`;

  document.getElementById("obj-pace").textContent =
    o.sessions_left
      ? `${o.sessions_left} session(s) left → ${fmt$((10000 - pnl) / o.sessions_left)}/session pace`
      : "";

  const sub = [];
  if (o.equity != null) sub.push(`equity ${fmt$(o.equity)}`);
  if (o.all_time_pnl_usd != null) sub.push(`all-time ${fmt$(o.all_time_pnl_usd)}`);
  if (o.today_pnl_usd != null) sub.push(`today ${fmt$(o.today_pnl_usd)}`);
  document.getElementById("obj-sub").textContent = sub.join("  |  ");
}

function renderPositions(positions, obj) {
  const pd = obj || {};
  const longPnl = (pd.long && pd.long.unrealized_pl != null) ? pd.long.unrealized_pl : 0;
  const shortPnl = (pd.short && pd.short.unrealized_pl != null) ? pd.short.unrealized_pl : 0;
  const total = (pd.total_unrealized_pl != null) ? pd.total_unrealized_pl : longPnl + shortPnl;

  const pdEl = document.getElementById("positions-dir");
  pdEl.innerHTML = `
    <div class="metric">
      <span class="label">Long positions</span>
      <span class="value tag long">${pd && pd.long ? pd.long.count : 0}</span>
    </div>
    <div class="metric"><span class="label">Long P/L</span><span class="value ${sign(longPnl)}">${fmt$(longPnl)}</span></div>
    <div class="metric"><span class="label">Short positions</span><span class="value tag short">${pd && pd.short ? pd.short.count : 0}</span></div>
    <div class="metric"><span class="label">Short P/L</span><span class="value ${sign(shortPnl)}">${fmt$(shortPnl)}</span></div>
    <div class="metric"><span class="label">Total unrealized</span><span class="value ${sign(total)}">${fmt$(total)}</span></div>
  `;

  const posEl = document.getElementById("positions");
  if (!positions || positions.length === 0) {
    posEl.innerHTML = `<div class="empty"><div class="icon">▭</div><div style="margin-top:8px">No open positions</div></div>`;
    return;
  }
  posEl.innerHTML = `<table><tr><th>Symbol</th><th>Dir</th><th>Qty</th><th>Entry</th><th>Now</th><th>P/L</th><th>%</th></tr>` +
    positions.map(p => {
      const pl = parseFloat(p.unrealized_pl || 0);
      const plpc = parseFloat(p.unrealized_plpc || 0) * 100;
      return `<tr>
        <td>${p.symbol}</td>
        <td><span class="tag ${p.direction}">${p.direction}</span></td>
        <td>${p.qty}</td>
        <td>${p.avg_entry_price}</td>
        <td>${p.current_price}</td>
        <td class="${sign(pl)}">${fmt$(pl)}</td>
        <td class="${sign(plpc)}">${plpc.toFixed(1)}%</td>
      </tr>`;
    }).join("") + "</table>";
}

function renderScorecard(s) {
  const el = document.getElementById("scorecard");
  if (!s || s.graded == null) {
    el.innerHTML = "<div class='empty'><div class='icon'>▭</div><div style=\"margin-top:8px\">No graded decisions yet</div></div>";
    return;
  }
  const winRate = s.graded ? ((s.thesis_right / s.graded) * 100).toFixed(1) : 0;
  el.innerHTML = `
    <div class="metric"><span class="label">Graded decisions</span><span class="value">${s.graded}</span></div>
    <div class="metric"><span class="label">Thesis right</span><span class="value pos">${s.thesis_right ?? 0}</span></div>
    <div class="metric"><span class="label">Thesis wrong</span><span class="value neg">${s.thesis_wrong ?? 0}</span></div>
    <div class="metric"><span class="label">Win rate</span><span class="value">${winRate}%</span></div>
    <div class="metric"><span class="label">Avg excess vs S&P</span><span class="value ${sign(s.avg_excess_pct || 0)}">${(s.avg_excess_pct ?? 0).toFixed(2)}%</span></div>
    <div class="metric"><span class="label">Shadow rows</span><span class="value">${s.shadow_rows ?? 0}</span></div>
  `;
}

function renderDecisions(today, optionEntries) {
  const t = document.getElementById("today");
  if (!today || today.length === 0) {
    t.innerHTML = "<div class='empty'><div class='icon'>▭</div><div style=\"margin-top:8px\">No decisions recorded today</div></div>";
    return;
  }
  t.innerHTML = `<table><tr><th>Ticker</th><th>Decision</th><th>Outcome</th></tr>` +
    today.map(r => {
      const placed = String(r.action || "").endsWith("_placed");
      const cls = placed ? "ok" :
        (String(r.action) === "error" || String(r.reason || "").startsWith("error") ? "err" : "block");
      return `<tr><td>${r.ticker}</td><td>${r.decision || "-"}</td>` +
        `<td><span class="tag ${cls}">${r.action}</span><div class="reason">${(r.reason || "").slice(0, 90)}</div></td></tr>`;
    }).join("") + "</table>" +
    (optionEntries && optionEntries.length
      ? `<div class="metric"><span class="label">Options entries today</span><span class="value">${optionEntries.join(" · ")}</span></div>` : "");
}

function renderStrategyPerf(s) {
  const el = document.getElementById("strategy-perf");
  if (!s || s.graded == null) {
    el.innerHTML = "<div class='empty'><div class='icon'>▭</div><div style=\"margin-top:8px\">No strategy data yet</div></div>";
    return;
  }
  const winRate = s.graded ? ((s.thesis_right / s.graded) * 100).toFixed(1) : 0;
  el.innerHTML = `
    <div class="metric"><span class="label">Graded decisions</span><span class="value">${s.graded}</span></div>
    <div class="metric"><span class="label">Thesis right</span><span class="value pos">${s.thesis_right ?? 0}</span></div>
    <div class="metric"><span class="label">Thesis wrong</span><span class="value neg">${s.thesis_wrong ?? 0}</span></div>
    <div class="metric"><span class="label">Win rate</span><span class="value">${winRate}%</span></div>
    <div class="metric"><span class="label">Avg excess vs S&P</span><span class="value ${sign(s.avg_excess_pct || 0)}">${(s.avg_excess_pct ?? 0).toFixed(2)}%</span></div>
    <div class="metric"><span class="label">Shadow rows</span><span class="value">${s.shadow_rows ?? 0}</span></div>
  `;
}

function renderShadows(shadows) {
  const sh = document.getElementById("shadows");
  if (!shadows || shadows.length === 0) {
    sh.innerHTML = "<div class='empty'><div class='icon'>▭</div><div style=\"margin-top:8px\">Nothing recorded yet</div></div>";
    return;
  }
  sh.innerHTML = `<table><tr><th>Date</th><th>Symbol</th><th>Action</th><th>Regime</th><th>Decision</th><th>Reason</th></tr>` +
    shadows.map(r => `<tr>
      <td>${r.date}</td><td>${r.symbol}</td>
      <td>${r.action}</td><td>${r.regime}</td><td>${r.decision || "-"}</td>
      <td class="reason">${r.reason}</td></tr>`).join("") + "</table>";
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
