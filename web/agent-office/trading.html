<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050a12">
<title>Trading Desk — Live</title>
<link rel="icon" href="data:,">

<link rel="stylesheet" href="/office.css">
<style>
  body { margin: 0; background: #050a12; color: #dce8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 100vh; }
  header.top { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid #1b2a3f; background: #071120; }
  header.top h1 { font-size: 14px; margin: 0; letter-spacing: .04em; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  header.top h1 .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  header.top a { color: #3b82f6; text-decoration: none; font-size: 13px; font-weight: 600; }
  header.top a:hover { color: #60a5fa; text-decoration: underline; }
  header.top .spacer { flex: 1; }
  header.top .clock { font-size: 12px; color: #94a3b8; }
  header.top .status { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  header.top .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }

  #api-error { display: none; margin: 12px 22px 0; padding: 10px 14px; border: 1px solid #b91c1c; background: rgba(239,68,68,.1); color: #ff9a9a; border-radius: 8px; font-size: 12px; }
  #api-error.show { display: block; }

  .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; padding: 16px 22px 24px; max-width: 1440px; margin: 0 auto; }
  .card { background: #0d1626; border: 1px solid #1b2a3f; border-radius: 10px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; font-weight: 700; color: #7fa8d8; letter-spacing: .09em; }
  .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0; }
  .pace { font-size: 12px; color: #f59e0b; margin-top: 6px; }
  .dim { color: #94a3b8; font-size: 12px; margin-top: 6px; }
  .pos { color: #4fd08a; }
  .neg { color: #ff7a7a; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: #94a3b8; font-weight: 500; padding: 5px 6px; border-bottom: 1px solid #1b2a3f; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
  td { padding: 4px 6px; border-bottom: 1px solid #14202f; vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; border: 1px solid; }
  .tag.ok { color: #4fd08a; border-color: #2b5f43; background: rgba(34,222,128,.1); }
  .tag.block { color: #ffce6a; border-color: #d97706; background: rgba(245,158,11,.1); }
  .tag.err { color: #ff7a7a; border-color: #b91c1c; background: rgba(239,68,68,.1); }
  .tag.long { color: #4fd08a; border-color: #22c55e; background: rgba(34,197,54,.1); }
  .tag.short { color: #ef4444; border-color: #ef4444; background: rgba(239,68,68,.1); }

  .split { display: flex; gap: 10px; margin-bottom: 10px; }
  .split .side { flex: 1; border: 1px solid #1b2a3f; border-radius: 8px; padding: 8px 10px; }
  .split .side .k { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; }
  .split .side .v { font-size: 16px; font-weight: 700; margin-top: 2px; }

  .metric { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid #14202f; font-size: 12.5px; }
  .metric:last-child { border-bottom: none; }
  .metric .label { color: #94a3b8; }
  .metric .value { font-weight: 700; }

  .reason { color: #94a3b8; font-size: 10.5px; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { display: flex; flex-direction: column; align-items: center; padding: 34px 20px; color: #94a3b8; font-size: 12px; }
  .empty .icon { font-size: 28px; margin-bottom: 8px; opacity: .45; }

  footer { padding: 12px 22px; color: #94a3b8; font-size: 11px; border-top: 1px solid #1b2a3f; display: flex; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="top">
<h1><span class="live-dot"></span>TRADING DESK — LIVE</h1>
<a href="/pipeline">pipeline</a>
<a href="/">office</a>
<div class="spacer"></div>
<div class="status"><div class="dot"></div>LIVE</div>
<div class="clock" id="clock">–</div>
</header>

<div id="api-error"></div>

<div class="wrap">
<section class="card" id="weekly-objective">
<h2>Weekly Objective</h2>
<div class="big" id="obj-big">–</div>
<div class="pace" id="obj-pace"></div>
<div class="dim" id="obj-sub"></div>
<div id="obj-today" style="font-size:13px;margin-top:8px"></div>
</section>

<section class="card">
<h2>Positions</h2>
<div class="split" id="positions-dir"></div>
<div id="positions"></div>
</section>

<section class="card">
<h2>Today's Decisions</h2>
<div id="today"></div>
</section>

<section class="card">
<h2>Strategy Performance</h2>
<div id="strategy-perf"></div>
</section>

<section class="card">
<h2>Scorecard</h2>
<div id="scorecard"></div>
</section>

<section class="card" style="grid-column: 1 / -1;">
<h2>Recent Decisions &amp; Blocks</h2>
<div id="shadows"></div>
</section>
</div>

<footer>
<span>Paper trading only — research software, not financial advice.</span>
<span id="last-updated">Last updated: –</span>
<span>Auto-refresh 30s</span>
</footer>

<script>
(function () {
  "use strict";

  var REFRESH_MS = 30000;

  function byId(id) { return document.getElementById(id); }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function num(v) {
    var n = parseFloat(v);
    return isFinite(n) ? n : 0;
  }

  function money(v) {
    var n = num(v);
    return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function money2(v) {
    var n = num(v);
    return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function pct(v, digits) {
    var n = num(v);
    return (n >= 0 ? "+" : "") + n.toFixed(digits == null ? 1 : digits) + "%";
  }

  function cls(v) { return num(v) >= 0 ? "pos" : "neg"; }

  function emptyBox(text) {
    return "<div class='empty'><div class='icon'>▭</div><div>" + esc(text) + "</div></div>";
  }

  function showError(msg) {
    var el = byId("api-error");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
  }

  function clearError() {
    var el = byId("api-error");
    if (!el) return;
    el.classList.remove("show");
    el.textContent = "";
  }

  function renderObjective(o) {
    o = o || {};
    var target = num(o.target_pnl_usd) || 10000;
    var week = num(o.week_pnl_usd);
    var weekPct = o.week_pct != null ? num(o.week_pct) : (target ? (week / target) * 100 : 0);

    byId("obj-big").innerHTML =
      "<span class='" + cls(week) + "'>" + money2(week) + "</span>" +
      " <span class='dim' style='font-size:14px'>of " + money(target) + " this week (" + pct(weekPct) + ")</span>";

    var left = o.sessions_left != null ? num(o.sessions_left) : null;
    byId("obj-pace").textContent = left && left > 0
      ? left + " session(s) left → " + money((target - week) / left) + "/session pace"
      : "";

    var sub = [];
    if (o.equity != null) sub.push("equity " + money2(o.equity));
    if (o.all_time_pnl_usd != null) sub.push("all-time " + money2(o.all_time_pnl_usd));
    if (o.week_of) sub.push("week of " + o.week_of);
    byId("obj-sub").textContent = sub.join("  |  ");

    var today = byId("obj-today");
    if (o.today_pnl_usd != null) {
      today.innerHTML = "Today <span class='" + cls(o.today_pnl_usd) + "'>" + money2(o.today_pnl_usd) + "</span>";
    } else {
      today.textContent = "";
    }
  }

  function renderDirectionSplit(split) {
    split = split || {};
    var l = split.long || { count: 0, unrealized_pl: 0 };
    var s = split.short || { count: 0, unrealized_pl: 0 };
    byId("positions-dir").innerHTML =
      "<div class='side'><div class='k'>Long · " + num(l.count) + "</div>" +
      "<div class='v " + cls(l.unrealized_pl) + "'>" + money2(l.unrealized_pl) + "</div></div>" +
      "<div class='side'><div class='k'>Short · " + num(s.count) + "</div>" +
      "<div class='v " + cls(s.unrealized_pl) + "'>" + money2(s.unrealized_pl) + "</div></div>";
  }

  function renderPositions(positions) {
    var el = byId("positions");
    if (!positions || !positions.length) {
      el.innerHTML = emptyBox("No open positions — desk is in cash");
      return;
    }
    var rows = positions.map(function (p) {
      var pl = num(p.unrealized_pl);
      var plpc = num(p.unrealized_plpc) * 100;
      var dir = (p.direction === "short" || num(p.qty) < 0) ? "short" : "long";
      return "<tr>" +
        "<td>" + esc(p.symbol) + "</td>" +
        "<td><span class='tag " + dir + "'>" + dir + "</span></td>" +
        "<td>" + esc(p.qty) + "</td>" +
        "<td>" + esc(p.avg_entry_price) + "</td>" +
        "<td>" + esc(p.current_price) + "</td>" +
        "<td class='" + cls(pl) + "'>" + money2(pl) + "</td>" +
        "<td class='" + cls(plpc) + "'>" + pct(plpc) + "</td>" +
        "</tr>";
    }).join("");
    el.innerHTML =
      "<table><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th>Now</th><th>P/L</th><th>%</th></tr>" +
      rows + "</table>";
  }

  function renderToday(records, options, openOrders) {
    var el = byId("today");
    var parts = [];
    if (records && records.length) {
      parts.push("<table><tr><th>Ticker</th><th>Decision</th><th>Action</th><th>Reason</th></tr>" +
        records.map(function (r) {
          var decision = r.decision || "-";
          var tag = decision === "skip" || decision === "blocked" ? "block" : (decision === "error" ? "err" : "ok");
          return "<tr>" +
            "<td>" + esc(r.ticker || r.symbol) + "</td>" +
            "<td><span class='tag " + tag + "'>" + esc(decision) + "</span></td>" +
            "<td>" + esc(r.action || "-") + "</td>" +
            "<td class='reason' title='" + esc(r.reason) + "'>" + esc(r.reason || "-") + "</td>" +
            "</tr>";
        }).join("") + "</table>");
    } else {
      parts.push(emptyBox("No decisions recorded today"));
    }
    if (openOrders && openOrders.length) {
      parts.push("<div class='dim' style='margin-top:10px'>Working orders (unfilled)</div>" +
        "<table style='margin-top:6px'><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Limit</th><th>Status</th></tr>" +
        openOrders.map(function (o) {
          return "<tr><td>" + esc(o.symbol) + "</td><td>" + esc(o.side) + "</td>" +
            "<td>" + esc(o.qty) + "</td><td>" + esc(o.limit_price) + "</td>" +
            "<td><span class='tag amber'>" + esc(o.status) + "</span></td></tr>";
        }).join("") + "</table>" +
        "<div class='dim' style='margin-top:4px'>Unfilled limits are not positions, so they do not appear above; they expire at the close if they never cross.</div>");
    }
    if (options && options.length) {
      parts.push("<div class='dim' style='margin-top:10px'>Options entries placed</div>" +
        "<div style='font-size:11.5px;color:#94a3b8;margin-top:4px'>" +
        options.map(function (line) { return "<div>" + esc(line) + "</div>"; }).join("") + "</div>");
    }
    el.innerHTML = parts.join("");
  }

  function renderStrategyPerf(sp) {
    sp = sp || {};
    var states = sp.states || {};
    var stateRows = Object.keys(states).map(function (k) {
      return "<div class='metric'><span class='label'>" + esc(k) + "</span><span class='value'>" + esc(states[k]) + "</span></div>";
    }).join("");
    byId("strategy-perf").innerHTML =
      "<div class='metric'><span class='label'>Total trades</span><span class='value'>" + num(sp.total_trades) + "</span></div>" +
      "<div class='metric'><span class='label'>Open</span><span class='value'>" + num(sp.open) + "</span></div>" +
      "<div class='metric'><span class='label'>Closed</span><span class='value'>" + num(sp.closed) + "</span></div>" +
      "<div class='metric'><span class='label'>Realized P/L</span><span class='value " + cls(sp.total_realized_pnl) + "'>" + money2(sp.total_realized_pnl) + "</span></div>" +
      stateRows;
  }

  function renderScorecard(s) {
    var el = byId("scorecard");
    if (!s || s.graded == null) {
      el.innerHTML = emptyBox("No graded decisions yet");
      return;
    }
    var graded = num(s.graded);
    var right = num(s.thesis_right);
    var wrong = num(s.thesis_wrong);
    var winRate = graded ? (right / graded) * 100 : 0;
    var excess = s.avg_excess_pct;
    el.innerHTML =
      "<div class='big'>" + graded + "</div><div class='dim' style='margin-top:0'>graded decisions</div>" +
      "<div class='metric'><span class='label'>Thesis right</span><span class='value pos'>" + right + "</span></div>" +
      "<div class='metric'><span class='label'>Thesis wrong</span><span class='value neg'>" + wrong + "</span></div>" +
      "<div class='metric'><span class='label'>Win rate</span><span class='value'>" + winRate.toFixed(1) + "%</span></div>" +
      "<div class='metric'><span class='label'>Avg excess vs S&amp;P</span><span class='value " + (excess == null ? "" : cls(excess)) + "'>" +
        (excess == null ? "–" : pct(excess, 2)) + "</span></div>" +
      "<div class='metric'><span class='label'>Shadow rows</span><span class='value'>" + num(s.shadow_rows) + "</span></div>";
  }

  function renderShadows(rows) {
    var el = byId("shadows");
    if (!rows || !rows.length) {
      el.innerHTML = emptyBox("Nothing recorded yet");
      return;
    }
    el.innerHTML = "<table><tr><th>Date</th><th>Symbol</th><th>Action</th><th>Regime</th><th>Decision</th><th>Reason</th></tr>" +
      rows.map(function (r) {
        return "<tr>" +
          "<td>" + esc(r.date) + "</td>" +
          "<td>" + esc(r.symbol) + "</td>" +
          "<td>" + esc(r.action) + "</td>" +
          "<td>" + esc(r.regime) + "</td>" +
          "<td>" + esc(r.decision || "-") + "</td>" +
          "<td class='reason' title='" + esc(r.reason) + "'>" + esc(r.reason || "-") + "</td>" +
          "</tr>";
      }).join("") + "</table>";
  }

  function safe(name, fn, arg) {
    try { fn(arg); }
    catch (exc) {
      showError(name + " render failed: " + (exc && exc.message ? exc.message : String(exc)));
    }
  }

  async function refresh() {
    var data;
    try {
      var res = await fetch("/api/trading", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      data = await res.json();
    } catch (exc) {
      showError("API error: " + (exc && exc.message ? exc.message : String(exc)));
      return;
    }
    clearError();
    safe("objective", renderObjective, data.objective);
    safe("positions", function () {
      renderDirectionSplit(data.positions_by_direction);
      renderPositions(data.positions);
    });
    safe("today", function () { renderToday(data.today, data.option_entries, data.open_orders); });
    safe("strategy", renderStrategyPerf, data.strategy_performance);
    safe("scorecard", renderScorecard, data.scorecard);
    safe("shadows", renderShadows, data.recent_shadows);
    safe("clock", function () {
      var stamp = data.generated_at || new Date().toISOString();
      byId("clock").textContent = stamp.replace("T", " ").slice(0, 19);
      byId("last-updated").textContent = "Last updated: " + stamp.replace("T", " ").slice(0, 19);
    });
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
