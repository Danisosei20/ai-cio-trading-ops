<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f19">
<title>Trading Desk — Live Monitor</title>
<link rel="stylesheet" href="/office.css">
<style>
  :root {
    --bg: #080f19;
    --card: #0d1626;
    --card-hover: #122037;
    --border: #1b2a3f;
    --accent: #7fa8d8;
    --accent-hover: #9bbfe0;
    --green: #4fd08a;
    --red: #ff7a7a;
    --amber: #ffce6a;
    --dim: #8fa8c8;
    --text: #dce6f5;
    --muted: #6e7f8f;
  }
  * { box-sizing: border-box; }
  html { font-size: 13px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh;
  }
  header.top {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: rgba(8,15,25,0.95);
  }
  header.top h1 { font-size: 15px; margin: 0; letter-spacing: .04em; font-weight: 600; }
  header.top a { color: var(--accent); text-decoration: none; font-size: 13px; }
  header.top a:hover { color: var(--accent-hover); text-decoration: underline; }
  header.top .spacer { flex: 1; }
  header.top .clock { font-size: 13px; color: var(--dim); font-family: ui-monospace; }
  header.top .status { font-size: 12px; font-family: ui-monospace; }
  header.top .status.ok { color: var(--green); }
  header.top .status.warn { color: var(--amber); }
  header.top .status.err { color: var(--red); }

  .wrap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 18px 22px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { border-color: #233a5f; }
  .card h2 {
    margin: 0 0 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .09em; color: var(--accent); font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card h2 .sub { font-size: 11px; font-weight: 400; color: var(--dim); margin-left: 8px; }

  .big { font-size: 28px; margin: 2px 0; font-weight: 700; letter-spacing: -0.01em; }
  .pos { color: var(--green); } .neg { color: var(--red); } .dim { color: var(--dim); }
  .muted { color: var(--muted); font-size: 11px; }

  .metric { display: flex; justify-content: space-between; font-size: 12px; margin: 5px 0; }
  .metric .label { color: var(--dim); }
  .metric .value { font-weight: 600; }

  .stat-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .stat-item { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .stat-item .label { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .stat-item .value { font-size: 16px; font-weight: 700; font-family: ui-monospace; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--accent); font-weight: 500; padding: 5px 6px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  td { padding: 5px 6px; border-bottom: 1px solid #14202f; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; border: 1px solid; font-weight: 600; letter-spacing: .02em; }
  .tag.ok { color: var(--green); border-color: #2b5f43; }
  .tag.block { color: var(--amber); border-color: #6a5626; }
  .tag.err { color: var(--red); border-color: #6a2b2b; }
  .tag.long { color: var(--green); border-color: #2b5f43; }
  .tag.short { color: var(--red); border-color: #6a2b2b; }

  .reason { color: var(--dim); font-size: 10.5px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .canvas-wrap { position: relative; height: 160px; }
  canvas { width: 100% !important; height: 100% !important; }

  .empty { color: var(--dim); font-size: 12.5px; text-align: center; padding: 20px; }

  .alert-banner {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
    font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  .alert-banner.warn { background: rgba(255,206,102,0.1); border: 1px solid rgba(255,206,102,0.3); color: var(--amber); }
  .alert-banner.err { background: rgba(255,122,122,0.1); border: 1px solid rgba(255,122,122,0.3); color: var(--red); }

  .refresh-badge {
    font-size: 10px; color: var(--muted); font-family: ui-monospace; margin-left: 8px;
  }

  footer { padding: 10px 22px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); }

  @media (max-width: 768px) {
    .wrap { grid-template-columns: 1fr; padding: 12px 16px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>TRADING DESK — LIVE</h1>
  <a href="/pipeline">pipeline</a>
  <a href="/">office</a>
  <div class="spacer"></div>
  <div id="status-indicator" class="status">● live</div>
  <div class="clock" id="clock">–</div>
</header>

<div class="alert-banner" id="alert-banner" style="display:none;"></div>

<div class="wrap">
  <!-- Weekly Objective Card -->
  <section class="card">
    <h2>Weekly Objective<span class="refresh-badge" id="obj-refresh">—</span></h2>
    <div class="big" id="obj-big">–</div>
    <div class="pace" id="obj-pace"></div>
    <div class="dim" id="obj-sub" style="font-size:12px;margin-top:6px"></div>
    <div id="obj-today" style="font-size:13px;margin-top:6px"></div>
  </section>

  <!-- Positions -->
  <section class="card" style="grid-column: 1 / -1;">
    <h2>Positions<span class="refresh-badge" id="pos-refresh">—</span></h2>
    <div id="positions-dir"></div>
    <div id="positions"></div>
  </section>

  <!-- Scorecard -->
  <section class="card">
    <h2>Scorecard<span class="refresh-badge" id="score-refresh">—</span></h2>
    <div id="scorecard"></div>
  </section>

  <!-- Today's Decisions -->
  <section class="card">
    <h2>Today's Decisions<span class="refresh-badge" id="dec-refresh">—</span></h2>
    <div id="today"></div>
  </section>

  <!-- Scorecard Metrics (macro) -->
  <section class="card" style="grid-column: 1 / -1;">
    <h2>Strategy Performance</h2>
    <div id="strategy-perf"></div>
  </section>

  <!-- Shadow Log -->
  <section class="card" style="grid-column: 1 / -1;">
    <h2>Recent Decisions &amp; Blocks<span class="refresh-badge" id="shadow-refresh">—</span></h2>
    <div id="shadows"></div>
  </section>
</div>

<footer>
  Paper trading only — research software, not financial advice.
  Auto-refreshes every 30s. <span id="last-updated">–</span>
</footer>

<script>
const fmt$ = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, {maximumFractionDigits: 0});
const fmtNum = (n) => n.toLocaleString(undefined, {maximumFractionDigits: 2});
const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
const sign = (n) => (n >= 0 ? "pos" : "neg");
const tagCls = (d) => (d === "long" ? "pos" : d === "short" ? "neg" : "dim");

let lastData = null;

async function refresh() {
  let d;
  try {
    const r = await fetch("/api/trading", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (e) {
    document.getElementById("clock").textContent = "–";
    document.getElementById("alert-banner").style.display = "block";
    document.getElementById("alert-banner").className = "alert-banner err";
    document.getElementById("alert-banner").textContent = "Site unreachable — " + (e.message || e);
    return;
  }
  document.getElementById("alert-banner").style.display = "none";
  document.getElementById("clock").textContent = d.generated_at || "";
  document.getElementById("last-updated").textContent = "Last updated: " + (d.generated_at || "–");

  const now = new Date();
  document.querySelectorAll("[id$='-refresh']").forEach(el => {
    el.textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
  });

  renderObjective(d.objective || {});
  renderPositions(d.positions || [], d.positions_by_direction || {});
  renderScorecard(d.scorecard || {});
  renderDecisions(d.today || [], d.option_entries || []);
  renderStrategyPerf(d.strategy_performance || {});
  renderShadows(d.recent_shadows || []);

  lastData = d;
}

function renderObjective(o) {
  const pnl = o.week_pnl_usd ?? 0;
  const big = document.getElementById("obj-big");
  big.innerHTML = `<span class="${sign(pnl)}">${fmt$(pnl)}</span>`;
  big.innerHTML += ` <span class="dim" style="font-size:15px">of $10,000 this week (${pct(o.week_pct ?? 0)})</span>`;

  document.getElementById("obj-pace").textContent =
    o.sessions_left ? `${o.sessions_left} session(s) left → ${fmt$((10000 - pnl) / o.sessions_left)}/session pace` : "";

  const sub = [];
  if (o.equity != null) sub.push(`equity ${fmt$(o.equity)}`);
  if (o.all_time_pnl_usd != null) sub.push(`all-time ${fmt$(o.all_time_pnl_usd)}`);
  if (o.today_pnl_usd != null) sub.push(`today ${fmt$(o.today_pnl_usd)}`);
  document.getElementById("obj-sub").textContent = sub.join("  |  ");
}

function renderPositions(positions, obj) {
  const pdEl = document.getElementById("positions-dir");
  const longPnl = (pd && pd.long ? pd.long.unrealized_pl : 0) || 0;
  const shortPnl = (pd && pd.short ? pd.short.unrealized_pl : 0) || 0;
  const total = (pd && pd.total_unrealized_pl != null) ? pd.total_unrealized_pl : longPnl + shortPnl;

  pdEl.innerHTML = `
    <div class="metric"><span class="label">Long positions</span><span class="value tag long">${pd && pd.long ? pd.long.count : 0}</span></div>
    <div class="metric"><span class="label">Long P/L</span><span class="value ${sign(longPnl)}">${fmt$(longPnl)}</span></div>
    <div class="metric"><span class="label">Short positions</span><span class="value tag short">${pd && pd.short ? pd.short.count : 0}</span></div>
    <div class="metric"><span class="label">Short P/L</span><span class="value ${sign(shortPnl)}">${fmt$(shortPnl)}</span></div>
    <div class="metric"><span class="label">Total unrealized</span><span class="value ${sign(total)}">${fmt$(total)}</span></div>
  `;

  const posEl = document.getElementById("positions");
  if (!positions || !positions.length) {
    posEl.innerHTML = "<div class='empty'>flat — no open positions</div>";
    return;
  }
  posEl.innerHTML = `<table><tr><th>Symbol</th><th>Dir</th><th>Qty</th><th>Entry</th><th>Now</th><th>P/L</th><th>%</th></tr>` +
    positions.map(p => {
      const pl = parseFloat(p.unrealized_pl || 0);
      const plpc = parseFloat(p.unrealized_plpc || 0) * 100;
      return `<tr>
        <td>${p.symbol}</td>
        <td><span class="tag ${p.direction}">${p.direction}</span></td>
        <td>${p.qty}</td>
        <td>${p.avg_entry_price}</td>
        <td>${p.current_price}</td>
        <td class="${sign(pl)}">${fmt$(pl)}</td>
        <td class="${sign(plpc)}">${plpc.toFixed(1)}%</td>
      </tr>`;
    }).join("") + "</table>";
}

function renderScorecard(s) {
  const el = document.getElementById("scorecard");
  if (!s || s.graded == null) {
    el.innerHTML = "<div class='empty'>no scorecard data yet</div>";
    return;
  }
  const winRate = s.graded ? ((s.thesis_right / s.graded) * 100).toFixed(1) : 0;
  el.innerHTML = `
    <div class="metric"><span class="label">Graded decisions</span><span class="value">${s.graded}</span></div>
    <div class="metric"><span class="label">Thesis right</span><span class="value pos">${s.thesis_right ?? 0}</span></div>
    <div class="metric"><span class="label">Thesis wrong</span><span class="value neg">${s.thesis_wrong ?? 0}</span></div>
    <div class="metric"><span class="label">Win rate</span><span class="value">${winRate}%</span></div>
    <div class="metric"><span class="label">Avg excess vs S&P</span><span class="value ${sign(s.avg_excess_pct || 0)}">${(s.avg_excess_pct ?? 0).toFixed(2)}%</span></div>
    <div class="metric"><span class="label">Shadow rows</span><span class="value">${s.shadow_rows ?? 0}</span></div>
  `;
}

function renderDecisions(today, optionEntries) {
  const t = document.getElementById("today");
  if (!today || !today.length) {
    t.innerHTML = "<div class='empty'>no decisions recorded today</div>";
  } else {
    t.innerHTML = "<table><tr><th>Ticker</th><th>Decision</th><th>Outcome</th></tr>" +
      today.map(r => {
        const placed = String(r.action || "").endsWith("_placed");
        const cls = placed ? "ok" : (String(r.action) === "error" || String(r.reason || "").startsWith("error") ? "err" : "block");
        return `<tr><td>${r.ticker}</td><td>${r.decision || "-"}</td>` +
          `<td><span class="tag ${cls}">${r.action}</span><div class="reason">${(r.reason || "").slice(0, 90)}</div></td></tr>`;
      }).join("") + "</table>" +
      (optionEntries && optionEntries.length
        ? `<div class="metric"><span class="label">Options entries today</span><span class="value">${optionEntries.join(" · ")}</span></div>` : "");
  }
}

function renderScorecardScorecard(s) { }

function renderStrategyPerf(s) {
  const el = document.getElementById("strategy-perf");
  if (!s || s.total_trades == null) {
    el.innerHTML = "<div class='empty'>no strategy data yet</div>";
    return;
  }
  const winRate = s.graded ? ((s.thesis_right / s.graded) * 100).toFixed(1) : 0;
  el.innerHTML = `
    <div class="metric"><span class="label">Graded decisions</span><span class="value">${s.graded}</span></div>
    <div class="metric"><span class="label">Thesis right</span><span class="value pos">${s.thesis_right ?? 0}</span></div>
    <div class="metric"><span class="label">Thesis wrong</span><span class="value neg">${s.thesis_wrong ?? 0}</span></div>
    <div class="metric"><span class="label">Win rate</span><span class="value">${winRate}%</span></div>
    <div class="metric"><span class="label">Avg excess vs S&P</span><span class="value ${sign(s.avg_excess_pct || 0)}">${(s.avg_excess_pct ?? 0).toFixed(2)}%</span></div>
    <div class="metric"><span class="label">Shadow rows</span><span class="value">${s.shadow_rows ?? 0}</span></div>
  `;
}

function renderShadows(shadows) {
  const sh = document.getElementById("shadows");
  if (!shadows || !shadows.length) {
    sh.innerHTML = "<div class='empty'>nothing recorded yet</div>";
    return;
  }
  sh.innerHTML = "<table><tr><th>Date</th><th>Symbol</th><th>Action</th><th>Regime</th><th>Decision</th><th>Reason</th></tr>" +
    shadows.map(r => `<tr><td>${r.date}</td><td>${r.symbol}</td>` +
      `<td>${r.action}</td><td>${r.regime}</td><td>${r.decision || "-"}</td>` +
      `<td class="reason">${r.reason}</td></tr>`).join("") + "</table>";
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
