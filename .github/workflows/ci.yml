name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      # Tests resolve ${VAR} config against .env, which is git-ignored by
      # design. CI gets non-secret dummy values (no broker/Slack credentials;
      # broker-dependent tests degrade gracefully without them).
      - name: Write CI .env (dummy non-secret values)
        run: |
          cat > .env <<'EOF'
          TIMEZONE=America/New_York
          SLACK_CHANNEL_ID=C0000000000
          HEALTH_SLACK_CHANNEL_ID=C0000000000
          APPROVAL_WINDOW_MINUTES=120
          ROBINHOOD_ACCOUNT_NICKNAME=Agentic
          INVESTMENT_OBJECTIVE=ci
          RISK_TOLERANCE=moderate
          TAX_CONTEXT=taxable
          TRADING_MODE=paper_auto
          TRADING_ENABLED=false
          PAPER_TRADING_ENABLED=true
          ALPACA_PAPER_TRADE=true
          ALPACA_PAPER_BASE_URL=https://paper-api.alpaca.markets
          EOF
      - run: ruff check robinhood_tools scripts tests
      - run: mypy robinhood_tools
      - run: coverage run -m unittest discover -s tests
      - run: coverage report
      - run: python scripts/secret_scan.py
      - run: pip-audit -r requirements-dev.lock
      - run: python -m json.tool config/approval_routes.example.json >/dev/null
