# Desk console (read-only UI + kill switch) in-cluster.
# Staging only: loopback auth model does not survive exposure — keep
# ClusterIP (no Ingress) until authentication lands. SQLite ledger lives
# on emptyDir here; Postgres migration removes that limitation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desk-console
  namespace: trading
  labels:
    app: desk-console
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: desk-console
  template:
    metadata:
      labels:
        app: desk-console
    spec:
      serviceAccountName: trading-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: trading-paper:local
          imagePullPolicy: IfNotPresent
          command: ["python3", "scripts/desk_server.py", "--host", "0.0.0.0", "--port", "8100"]
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: trading-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: outputs
              mountPath: /app/outputs
      volumes:
        - name: outputs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: desk-console
  namespace: trading
  labels:
    app: desk-console
spec:
  type: ClusterIP
  selector:
    app: desk-console
  ports:
    - name: http
      port: 8100
      targetPort: http
