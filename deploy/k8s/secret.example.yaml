# Template only — never commit real secrets. In-cluster, replace with
# External Secrets Operator (SecretStore -> Secret with the same name/keys).
#   ALERT_WEBHOOK_SECRET : shared secret for POST /alert
#   ALPACA_API_KEY / ALPACA_SECRET_KEY : paper credentials (paper phase only)
apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  namespace: trading
  annotations:
    external-secrets.io/managed-by: external-secrets
type: Opaque
stringData:
  ALERT_WEBHOOK_SECRET: CHANGEME
  # ALPACA_API_KEY / ALPACA_SECRET_KEY are intentionally absent here:
  # provide them via External Secrets Operator, never in git.
